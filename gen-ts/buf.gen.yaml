version: v2

plugins:
  # ★ node 로 직접 실행합니다.
  #   ./node_modules/.bin/protoc-gen-ts_proto 는 Windows 에서 확장자 없는 셸
  #   스크립트라 buf 가 실행하지 못합니다("... 파일 또는 외부 명령이 아닙니다").
  #   .cmd 를 가리키면 이번엔 Linux/CI 에서 깨집니다. node + JS 진입점이
  #   양쪽에서 동작하는 유일한 조합입니다.
  - local: ["node", "./node_modules/ts-proto/protoc-gen-ts_proto"]
    out: src/generated
    opt:
      - esModuleInterop=true
      # 웹 클라이언트는 gRPC 를 쓰지 않습니다 (WebSocket + REST 만)
      - outputServices=false
      - useOptionals=messages
      - oneof=unions
      # int64 를 number 로 매핑합니다.
      # 주의: JS number 는 2^53 까지만 정확합니다. roomId·seq 가 그 이상으로
      # 커질 규모가 되면 bigint 로 바꿔야 합니다 (학습 범위에서는 안전).
      - forceLong=number
      - snakeToCamel=true
      # ★ 생성 코드의 상대 import 에 .js 를 붙입니다.
      #   기본값은 확장자 없는 `from "./common"` 인데, 번들러(Vite)는 참아 주지만
      #   Node ESM 은 ERR_MODULE_NOT_FOUND 로 죽습니다.
      #   부하테스트 스크립트처럼 Node 에서 직접 쓰는 소비자가 있으므로 붙여 둡니다.
      - importSuffix=.js
