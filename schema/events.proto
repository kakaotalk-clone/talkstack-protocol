syntax = "proto3";

package kakaoclone.event;

import "common.proto";

option java_package = "com.kakaoclone.protocol.event";
option java_multiple_files = true;

// ─────────────────────────────────────────────────────────────
//  Kafka 이벤트
//
//  토픽              파티션 키   컨슈머
//  ─────────────────────────────────────────────────────────
//  message.created   room_id    FanoutConsumer, (Phase4) 검색색인
//  push.required     user_id    PushConsumer
//  read.updated      room_id    FanoutConsumer
//
//  파티션 키를 room_id 로 두면 같은 방의 이벤트가 같은 파티션에 들어가
//  순서가 보장됩니다. 이게 fanout 순서 역전을 막습니다.
// ─────────────────────────────────────────────────────────────

message MessageCreated {
  kakaoclone.common.ChatMessage message      = 1;
  repeated int64                member_ids   = 2;   // fanout 대상 (발신자 포함)
  int32                         member_count = 3;
  int64                         occurred_at  = 4;

  // 채팅 목록에 보여줄 한 줄 요약 ("사진", "동영상", 텍스트 앞부분).
  //
  // kakao_core 는 MongoDB 를 직접 읽을 수 없으므로 chat_rooms 에 복제해야 하는데,
  // 포맷 규칙(타입별 문구, 줄바꿈 제거, 200자 컷)을 kakao-api 가 다시 구현하면
  // 두 곳이 어긋납니다. 만든 쪽이 계산해서 실어 보냅니다.
  string preview = 5;
}

message ReadUpdatedEvent {
  int64 room_id      = 1;
  int64 user_id      = 2;   // 읽은 사람. 이 사람에게는 되돌려 보내지 않습니다
  int64 seq          = 3;
  int64 min_read_seq = 4;   // 방 전체의 최소 읽음 위치. 클라이언트가 이걸로 "1"을 지웁니다
  int64 occurred_at  = 5;

  // 필드 추가는 하위 호환이라 안전합니다 (README 의 호환성 규칙 참조).
  // 컨슈머가 방 정보를 다시 조회하지 않도록 fanout 대상을 함께 실어 보냅니다.
  repeated int64 member_ids = 6;
}

message MessageDeleted {
  int64 room_id            = 1;
  int64 seq                = 2;
  int64 deleted_by         = 3;
  repeated int64 member_ids = 4;
  int64 occurred_at        = 5;
}

// 접속 중이 아닌 멤버에게만 발행됩니다.
message PushRequired {
  int64  user_id      = 1;   // 받을 사람 (미접속자)
  int64  room_id      = 2;
  string room_title   = 3;   // 비어 있으면 kakao-api 가 자기 DB 에서 채웁니다
  string sender_name  = 4;   // 〃
  string preview      = 5;
  int32  unread_total = 6;
  int64  occurred_at  = 7;

  // 발신자. 이름은 kakao_core 에만 있으므로 id 만 실어 보내고
  // kakao-api 가 알림 문구를 완성합니다.
  int64  sender_id    = 8;
  int64  seq          = 9;
}
