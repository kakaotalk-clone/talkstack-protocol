syntax = "proto3";

package kakaoclone.common;

option java_package = "com.kakaoclone.protocol.common";
option java_multiple_files = true;

// ─────────────────────────────────────────────────────────────
//  여러 스키마가 공유하는 값 타입
//
//  호환성 규칙 (README 참조)
//   - 필드 추가만 허용. 삭제·타입 변경 금지
//   - 삭제해야 하면 reserved 로 번호를 영구 봉인
//   - enum 은 항상 0번을 UNSPECIFIED 로 둔다 (proto3 기본값)
// ─────────────────────────────────────────────────────────────

enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  TEXT   = 1;
  IMAGE  = 2;
  VIDEO  = 3;
  FILE   = 4;
  SYSTEM = 5;   // 입장/퇴장 안내 등
}

enum RoomType {
  ROOM_TYPE_UNSPECIFIED = 0;
  DIRECT = 1;   // 1:1
  GROUP  = 2;
}

// 채팅 메시지 한 통. WS 프레임 · gRPC 응답 · Kafka 이벤트가 모두 이 타입을 씁니다.
message ChatMessage {
  int64                     room_id     = 1;
  int64                     seq         = 2;   // 방 단위 단조 증가 — 순서·읽음의 기준
  int64                     sender_id   = 3;
  kakaoclone.common.MessageType type     = 4;
  string                    content      = 5;
  string                    attachment   = 6;  // JSON 문자열 (이미지 메타 등)
  int64                     created_at   = 7;  // epoch millis
  string                    client_msg_id = 8; // 발신자 로컬 식별자 (멱등성)
}

message Error {
  string code    = 1;   // ErrorCode enum 의 name()
  string message = 2;
}
