syntax = "proto3";

package kakaoclone.chat;

import "common.proto";

option java_package = "com.kakaoclone.protocol.chat";
option java_multiple_files = true;

// ─────────────────────────────────────────────────────────────
//  Gateway → Chat Service (gRPC)
//
//  Gateway 는 비즈니스 로직을 갖지 않으므로, 프레임을 받으면
//  전부 이 서비스로 넘깁니다.
// ─────────────────────────────────────────────────────────────

service ChatService {
  rpc SendMessage   (SendMessageRequest)   returns (SendMessageResponse);
  rpc MarkRead      (MarkReadRequest)      returns (MarkReadResponse);
  rpc Sync          (SyncRequest)          returns (SyncResponse);
  rpc DeleteMessage (DeleteMessageRequest) returns (DeleteMessageResponse);
  rpc LoadHistory   (LoadHistoryRequest)   returns (LoadHistoryResponse);
}

// 메시지 삭제. 행을 지우지 않고 deleted_at 만 채웁니다 —
// seq 가 사라지면 delta sync 에 구멍이 생기고, 이미 받아간 클라이언트와
// 어긋납니다. 카톡처럼 "삭제된 메시지입니다" 로 대체됩니다.
message DeleteMessageRequest {
  int64 room_id   = 1;
  int64 seq       = 2;
  int64 requester = 3;   // 본인 메시지만 지울 수 있습니다
}

message DeleteMessageResponse {
  int64 room_id = 1;
  int64 seq     = 2;
}

message SendMessageRequest {
  int64                        room_id       = 1;
  int64                        sender_id     = 2;
  string                       client_msg_id = 3;
  kakaoclone.common.MessageType type         = 4;
  string                       content       = 5;
  string                       attachment    = 6;
}

message SendMessageResponse {
  kakaoclone.common.ChatMessage message    = 1;
  int32                         unread_count = 2;
  bool                          duplicated   = 3;   // 멱등 재전송이었다
}

message MarkReadRequest {
  int64 room_id = 1;
  int64 user_id = 2;
  int64 seq     = 3;
}

message MarkReadResponse {
  bool  changed      = 1;   // false = 뒤로 가는 갱신이라 무시됨
  int64 min_read_seq = 2;
}

message SyncRequest {
  int64             user_id = 1;
  repeated RoomCursor rooms = 2;
}

message RoomCursor {
  int64 room_id  = 1;
  int64 last_seq = 2;
}

message SyncResponse {
  repeated RoomDelta rooms = 1;
}

// 과거 메시지 페이징. Sync 가 requires_full_reload 를 돌려준 뒤
// 클라이언트가 회복하는 경로이기도 합니다.
message LoadHistoryRequest {
  int64 room_id    = 1;
  int64 user_id    = 2;   // 방 참여자인지 확인합니다
  int64 before_seq = 3;   // 0 이면 최신부터
  int32 limit      = 4;
}

message LoadHistoryResponse {
  repeated kakaoclone.common.ChatMessage messages = 1;   // seq DESC
  bool                                  has_more = 2;
}

message RoomDelta {
  int64                                 room_id              = 1;
  repeated kakaoclone.common.ChatMessage messages            = 2;
  int64                                 last_seq             = 3;
  bool                                  requires_full_reload = 4;
}
